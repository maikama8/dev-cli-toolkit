name: Feature request
description: An idea for a command or a change in behavior
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do today, and where zt falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command or flag you have in mind, and how it should behave.
    validations:
      required: true
